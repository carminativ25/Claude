## Juniper EX2300-48P Configuration with Client Isolation
## All client devices are isolated from each other but can communicate with the gateway

system {
    host-name ex2300-client-isolation;
    domain-name example.com;
    time-zone America/New_York;

    root-authentication {
        encrypted-password "$6$salt$hash"; ## SECRET-DATA
    }

    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$salt$hash"; ## SECRET-DATA
            }
        }
    }

    services {
        ssh {
            root-login deny;
            protocol-version v2;
        }
        netconf {
            ssh;
        }
        web-management {
            https {
                system-generated-certificate;
            }
        }
    }

    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
    }

    ntp {
        server 0.pool.ntp.org;
        server 1.pool.ntp.org;
    }
}

chassis {
    aggregated-devices {
        ethernet {
            device-count 2;
        }
    }
}

interfaces {
    ## Management Interface
    vme {
        unit 0 {
            family inet {
                address 192.168.1.100/24;
            }
        }
    }

    ## Uplink/Gateway Port (Promiscuous - can talk to all isolated ports)
    ge-0/0/47 {
        description "Uplink to Gateway/Router";
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members clients-primary;
                }
                native-vlan-id 100;
            }
        }
    }

    ## Optional second uplink for redundancy
    ge-0/0/46 {
        description "Secondary Uplink";
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members clients-primary;
                }
                native-vlan-id 100;
            }
        }
    }

    ## Client Access Ports (ge-0/0/0 through ge-0/0/45)
    ## These ports are isolated - devices cannot talk to each other
    ## But they can communicate with the promiscuous ports (uplinks)

    ge-0/0/0 {
        description "Isolated Client Port";
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members clients-isolated;
                }
            }
        }
    }

    ge-0/0/1 {
        description "Isolated Client Port";
        unit 0 {
