## Private VLAN Configuration
vlans {
    clients-primary {
        description "Primary VLAN for Client Network";
        vlan-id 100;
        interface {
            ge-0/0/46.0;
            ge-0/0/47.0;
        }
        isolated-vlan 101;
    }

    clients-isolated {
        description "Isolated VLAN - Clients cannot communicate with each other";
        vlan-id 101;
        isolated-vlan;
    }
}

protocols {
    rstp {
        interface ge-0/0/46;
        interface ge-0/0/47;
    }

    lldp {
        interface all;
    }

    lldp-med {
        interface all;
    }
}

ethernet-switching-options {
    storm-control {
        interface all;
    }
}

## Enable PoE on all ports (EX2300-48P has 48 PoE+ ports)
poe {
    interface all;
}
