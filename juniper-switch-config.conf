## Juniper EX Series Switch Configuration
## This configuration provides a baseline setup for a typical enterprise switch

system {
    host-name juniper-switch-01;
    domain-name example.com;
    time-zone America/New_York;

    root-authentication {
        encrypted-password "$6$salt$hash"; ## SECRET-DATA
    }

    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$salt$hash"; ## SECRET-DATA
            }
        }
    }

    services {
        ssh {
            root-login deny;
            protocol-version v2;
            max-sessions-per-connection 32;
        }
        netconf {
            ssh;
        }
        web-management {
            https {
                system-generated-certificate;
            }
        }
    }

    syslog {
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
        file interactive-commands {
            interactive-commands any;
        }
    }

    ntp {
        server 0.pool.ntp.org;
        server 1.pool.ntp.org;
    }
}

chassis {
    aggregated-devices {
        ethernet {
            device-count 8;
        }
    }
}

interfaces {
    ## Management Interface
    vme {
        unit 0 {
            family inet {
                address 192.168.1.100/24;
            }
        }
    }

    ## Access Ports - VLAN 10 (Data)
    ge-0/0/0 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members vlan-data;
                }
            }
        }
    }

    ge-0/0/1 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members vlan-data;
                }
            }
        }
    }

    ## Access Ports - VLAN 20 (Voice)
    ge-0/0/2 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members vlan-voice;
                }
            }
        }
    }

    ge-0/0/3 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members vlan-voice;
                }
            }
        }
    }

    ## Trunk Port to Core Switch
    ge-0/0/47 {
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ vlan-data vlan-voice vlan-guest vlan-management ];
                }
            }
        }
    }

    ## Link Aggregation Example (LAG)
    ae0 {
        description "Link Aggregation to Uplink";
        aggregated-ether-options {
            lacp {
                active;
                periodic fast;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members all;
                }
            }
        }
    }

    ## Member interfaces for LAG
    ge-0/0/46 {
        ether-options {
            802.3ad ae0;
        }
    }
}

snmp {
    community public {
        authorization read-only;
    }
    community private {
        authorization read-write;
    }
}

vlans {
    vlan-data {
        description "Data VLAN";
        vlan-id 10;
        l3-interface vlan.10;
    }

    vlan-voice {
        description "Voice VLAN";
        vlan-id 20;
        l3-interface vlan.20;
    }

    vlan-guest {
        description "Guest VLAN";
        vlan-id 30;
        l3-interface vlan.30;
    }

    vlan-management {
        description "Management VLAN";
        vlan-id 99;
        l3-interface vlan.99;
    }

    default {
        vlan-id 1;
    }
}

protocols {
    rstp {
        interface ge-0/0/47 {
            edge;
            no-root-port;
        }
        interface ae0 {
            no-root-port;
        }
    }

    lldp {
        interface all;
    }

    lldp-med {
        interface all;
    }
}

ethernet-switching-options {
    storm-control {
        interface all;
    }
}

poe {
    interface all;
}
