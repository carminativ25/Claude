# Stock agent configuration.
#
# The primary workflow is the news-driven DAY TRADING strategy (section
# "daytrade"). The long-term ETF "portfolio" strategy below it is still
# available via `stock-agent portfolio ...`.
#
# Nothing here is financial advice. Paper trade first.

daytrade:
  max_picks: 3                   # positions opened per day
  risk_per_trade_pct: 0.5        # max % of equity lost if a stop is hit (sets share count)
  max_position_pct: 20.0         # max % of equity in one position
  max_daily_loss_pct: 2.0        # flatten everything and stop for the day
  min_price: 5.0                 # ignore penny stocks ...
  max_price: 1000.0              # ... and very expensive ones (whole-share sizing)
  min_avg_dollar_volume: 20000000  # 20-day average $ traded per day; keeps you in liquid names
  max_spread_pct: 0.3            # skip anything with a bid/ask spread wider than this
  min_stop_pct: 0.75             # stop distance bounds; the analyst's stop is clamped into this range
  max_stop_pct: 4.0
  min_reward_risk: 1.5           # target must be at least this multiple of the stop
  allow_short: false             # long only by default
  entry_delay_minutes: 5         # schedule 'open' this long after 9:30 ET
  flatten_minutes_before_close: 10
  news_lookback_hours: 18        # headlines since yesterday afternoon
  screener_top: 25               # top gainers / losers / most-active to consider
  respect_pdt_rule: true         # under $25k equity: at most 3 day trades per 5 business days
  analyst_model: claude-opus-5   # Claude model used to write the morning game plan
  analyst_effort: high           # low | medium | high | xhigh | max
  blocklist: []                  # symbols never to trade, e.g. [TSLA, GME]
  journal_dir: journal

# ---------------------------------------------------------------------------
# Long-term ETF portfolio (`stock-agent portfolio ...`). Example allocation.
# Target weights + trading.cash_buffer_pct must sum to 100%.
# ---------------------------------------------------------------------------
targets:
  SCHD: 0.30   # US dividend-growth stocks
  VYM:  0.15   # US high-dividend-yield stocks
  VTI:  0.25   # total US market (growth engine, lower yield)
  JEPI: 0.12   # covered-call income ETF (monthly distributions)
  BND:  0.15   # US aggregate bonds (also the defensive asset in risk-off)

trading:
  cash_buffer_pct: 3.0        # keep this share of the portfolio in cash
  drift_threshold_pct: 3.0    # sell only when a holding is this far above target
  min_order_value: 5.0        # ignore orders smaller than this (dollars)
  allow_sells: true           # set false for a buy-only, never-sell agent

regime:
  enabled: true
  benchmark: SPY              # trend signal source
  sma_days: 200               # risk-off when SPY closes below its 200-day SMA
  risk_off_equity_scale: 0.5  # equity targets are halved in risk-off ...
  defensive_symbol: BND       # ... and the freed weight goes here (must be in targets)

risk:
  max_order_value: 2000.0        # hard cap per order (dollars)
  max_daily_trade_value: 5000.0  # hard cap on total traded per run (dollars)
  max_position_weight: 0.60      # never buy a holding above this weight (must allow the risk-off BND weight)
  max_drawdown_pct: 20.0         # pause buying if equity is this far below its 1-year peak
  require_market_open: true      # never queue orders while the market is closed

backtest:
  initial_cash: 10000.0
  monthly_contribution: 500.0
  rebalance_every_days: 5        # trading days between strategy evaluations
